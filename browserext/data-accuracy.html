<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Data Accuracy</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
    --keep: #30a46c;
    --merge: #f5a524;
    --change: #8e4ec6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #38383a;
      --accent: #2997ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 8px 0 12px;
    margin-bottom: 8px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  #status { color: var(--muted); font-size: 13px; width: 100%; }
  button, .file-btn {
    padding: 7px 14px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  .file-btn input { display: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  select {
    padding: 6px 8px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  label.inline { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .tabs { display: flex; gap: 8px; margin: 8px 0 16px; }
  .tabs button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .item.decided { border-color: var(--keep); }
  .item.decided.change { border-color: var(--change); }
  .item.decided.merge { border-color: var(--merge); }
  .item-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 8px; }
  .item-head .title { font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); }
  .reason { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .reason b { color: var(--text); font-weight: 500; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .ex {
    width: 190px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ex img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 6px; cursor: zoom-in; }
  .ex .name { font-size: 13px; font-weight: 600; }
  .ex .meta { font-size: 11px; color: var(--muted); word-break: break-all; }
  .ex.unmatched { opacity: 0.55; }
  .ex.keep { border-color: var(--keep); box-shadow: 0 0 0 2px var(--keep); }
  .ex.merge { border-color: var(--merge); box-shadow: 0 0 0 2px var(--merge); }
  .ex .other-decision { font-size: 11px; color: var(--merge); }
  .ex .actions { display: flex; gap: 6px; }
  .ex .actions button { flex: 1; padding: 4px 6px; font-size: 12px; }
  .ex .actions button.on-keep { background: var(--keep); border-color: var(--keep); color: #fff; }
  .ex .actions button.on-merge { background: var(--merge); border-color: var(--merge); color: #000; }
  .types { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .types button { padding: 4px 10px; font-size: 12px; }
  .types button.suggested { border-color: var(--change); }
  .types button.current { border-style: dashed; }
  .types button.selected { background: var(--change); border-color: var(--change); color: #fff; }
  .types button.selected.current { background: var(--keep); border-color: var(--keep); }
  .type-body { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 8px; }
  .group-actions { display: flex; gap: 8px; margin-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 32px; }
  #prompt-panel { margin-top: 16px; }
  #prompt-panel textarea {
    width: 100%;
    height: 360px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    padding: 8px;
  }
  #warnings { color: #e5484d; font-size: 13px; white-space: pre-line; }
  #zoom {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none;
    align-items: center; justify-content: center; z-index: 10; cursor: zoom-out;
  }
  #zoom.show { display: flex; }
  #zoom img { max-width: 90vw; max-height: 90vh; background: #fff; border-radius: 8px; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Review data accuracy</h1>
  <label class="file-btn">Load reports folder<input type="file" id="reports-dir" webkitdirectory multiple></label>
  <label class="file-btn">Load .md files<input type="file" id="reports-files" accept=".md,text/markdown" multiple></label>
  <label class="file-btn">Load exercises.json<input type="file" id="catalog-file" accept=".json,application/json"></label>
  <label class="inline">Report
    <select id="source-filter"><option value="">All</option></select>
  </label>
  <label class="inline"><input type="checkbox" id="undecided-only"> Undecided only</label>
  <button id="reset">Reset decisions</button>
  <button id="generate" class="primary">Generate prompt</button>
  <div id="status">Loading…</div>
</header>

<div class="tabs">
  <button data-tab="types" class="active">Type changes</button>
  <button data-tab="duplicates">Duplicates</button>
</div>

<main id="list"></main>

<section id="prompt-panel" hidden>
  <div id="warnings"></div>
  <div class="group-actions">
    <button id="copy-prompt" class="primary">Copy prompt</button>
    <button id="close-prompt">Close</button>
  </div>
  <textarea id="prompt" readonly></textarea>
</section>

<div id="zoom"><img alt=""></div>
<div id="toast"></div>
<script src="data-accuracy.js"></script>
</body>
</html>
