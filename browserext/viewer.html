<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Viewer</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #38383a;
      --accent: #2997ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    padding: 16px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  #status { color: var(--muted); font-size: 14px; }
  button {
    padding: 8px 16px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }
  input[type="number"] { width: 80px; }
  input[type="number"], select {
    padding: 7px 8px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr));
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .card .img-wrap {
    flex: 1;
    min-height: 0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .missing { color: #999; font-size: 13px; }
  .card .info { padding: 10px 12px; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; word-break: break-all; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
  .card .actions button { padding: 5px 10px; font-size: 12px; }
  .card.problem { border-color: #e5484d; box-shadow: 0 0 0 2px #e5484d; }
  .card.problem button.mark { background: #e5484d; border-color: #e5484d; color: #fff; }
  #toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #problems-dialog {
    width: min(640px, calc(100vw - 32px));
    max-height: calc(100vh - 64px);
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
  }
  #problems-dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
  #problems-dialog .dialog-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  #problems-dialog h2 { font-size: 16px; margin: 0; flex: 1; }
  #problems-list { list-style: none; margin: 0; padding: 8px 16px; overflow-y: auto; }
  #problems-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  #problems-list li:last-child { border-bottom: none; }
  #problems-list .row-text { flex: 1; min-width: 0; }
  #problems-list .row-name { font-size: 14px; font-weight: 600; }
  #problems-list .row-id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  #problems-list button { padding: 5px 10px; font-size: 12px; }
  #problems-list .empty { color: var(--muted); justify-content: center; border: none; }
</style>
</head>
<body>
<header>
  <h1>Exercise Viewer</h1>
  <span id="status">Loading…</span>
  <button id="prev">Previous</button>
  <button id="next" class="primary">Next</button>
  <label>Go to # <input id="jump" type="number" min="1"></label>
  <label>Per page
    <select id="page-size">
      <option>1</option><option>2</option><option>3</option><option selected>4</option>
      <option>6</option><option>8</option><option>12</option><option>16</option><option>24</option>
    </select>
  </label>
  <button id="show-problems">Show problems</button>
  <button id="export">Export problems (0)</button>
  <button id="clear">Clear problems</button>
  <button id="send-to-downloader">Send problems to downloader</button>
</header>
<div id="grid"></div>
<div id="toast"></div>
<dialog id="problems-dialog">
  <div class="dialog-header">
    <h2 id="problems-title">Problematic exercises</h2>
    <button id="copy-all">Copy all</button>
    <button id="close-problems">Close</button>
  </div>
  <ul id="problems-list"></ul>
</dialog>

<script src="viewer.js"></script>
</body>
</html>
